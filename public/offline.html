<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f4553b" />
    <title>Brak połączenia | Idź na miasto</title>
    <!--
      Served by the service worker (src/sw.ts) for a page that was never
      visited while the connection is down. It cannot count on anything else
      loading, so everything it needs is inline: no fonts, no app bundle.
      Colours mirror src/styles/tokens.scss.
    -->
    <style>
      :root {
        --bg: #fbf8f3;
        --surface: #ffffff;
        --ink: #221c26;
        --muted: #6e6575;
        --accent: #f4553b;
        --accent-hover: #d9432f;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17131c;
          --surface: #221c29;
          --ink: #f5f1ea;
          --muted: #9c93a6;
          --accent: #f86a50;
          --accent-hover: #f4553b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 28rem;
        width: 100%;
        background: var(--surface);
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #fff;
        font-size: 28px;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        line-height: 1.25;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      button {
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-hover);
      }
      button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">!</div>
      <h1>Jesteś offline</h1>
      <p>
        Tej strony nie ma jeszcze w pamięci urządzenia. Strony, które już odwiedziłeś, działają bez
        internetu — tę zobaczysz, gdy połączenie wróci.
      </p>
      <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
    </main>
    <script>
      // Come back by itself as soon as the connection does.
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
