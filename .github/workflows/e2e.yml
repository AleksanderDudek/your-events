name: E2E (insights · non-blocking)

# Playwright end-to-end tests that drive the REAL app against the live Supabase
# project. This workflow is deliberately INFORMATIONAL:
#   • It is a separate workflow from ci.yml, so it runs in parallel and never
#     delays the main lint / type-check / unit-test pipeline.
#   • The test step is `continue-on-error`, so the job always concludes green —
#     a failing e2e never blocks a merge, even under "require checks" rules.
#   • Results surface as a job summary, a sticky PR comment, and a downloadable
#     HTML report artifact. That's the "additional insight" — not a gate.
#
# To make this a real merge gate later: drop `continue-on-error` on the test
# step and add "E2E (insights · non-blocking) / e2e" to branch protection.
#
# Two jobs run in parallel: `e2e` drives `next dev`, `e2e-export` drives the
# static export that actually ships. They catch different classes of bug — see
# the comment above each.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # to post the insights comment

# Newer runs supersede in-flight ones for the same branch/PR.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The dev-server suite: broad coverage of the whole app.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Environment-scoped configuration: e2e reads the dev schema, never
    # production's. The credentials are the same either way — it is
    # NEXT_PUBLIC_SUPABASE_SCHEMA below that does the separating.
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Both the chromium and "Mobile Chrome" projects use the chromium binary,
      # so a single browser download covers the whole CI matrix.
      - name: Install Playwright browser (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        id: e2e
        continue-on-error: true # insights only — never fail the job
        env:
          # Anon key is public (RLS-protected) and already a repo secret used by
          # deploy.yml. Serve the app at the domain root for the tests.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Per-city (multi-city): Wrocław events endpoint. Without these the
          # build/dev marks Wrocław available:false and it's hidden from the picker.
          NEXT_PUBLIC_SUPABASE_URL_WROCLAW: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_WROCLAW }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY_WROCLAW: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_WROCLAW }}
          # What actually separates dev from production: one Supabase project,
          # two schemas. Without this the client falls back to 'public' and the
          # tests read production rows despite `environment: dev` above.
          NEXT_PUBLIC_SUPABASE_SCHEMA: ${{ vars.NEXT_PUBLIC_SUPABASE_SCHEMA }}
          NEXT_PUBLIC_BASE_PATH: ''
        run: pnpm exec playwright test --project=chromium --project="Mobile Chrome"

      - name: Build insights summary
        if: always()
        run: node .github/scripts/e2e-summary.mjs

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment insights on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true # a comment failure must not fail the job
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- e2e-insights -->';
            let body;
            try {
              body = fs.readFileSync('e2e-comment.md', 'utf8');
            } catch {
              body = `${marker}\n### 🎭 E2E insights (non-blocking)\n\nNo report was generated.`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # The static-export suite: the artifact GitHub Pages actually serves. `next
  # dev` keeps a real server and an RSC endpoint behind the app, so App Router
  # behaviour that only differs under `output: 'export'` is invisible to the job
  # above — that is how a list whose paging silently snapped back to the
  # cold-load URL in production shipped with every dev-server test green.
  # Separate job so it runs in parallel with the dev suite.
  e2e-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: pnpm exec playwright install --with-deps chromium

      # Builds the export and serves out/ with a plain file server — the config
      # owns both (playwright.export.config.ts).
      - name: Run static-export E2E tests
        continue-on-error: true # insights only, same policy as the job above
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL_WROCLAW: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_WROCLAW }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY_WROCLAW: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_WROCLAW }}
          NEXT_PUBLIC_SUPABASE_SCHEMA: ${{ vars.NEXT_PUBLIC_SUPABASE_SCHEMA }}
        run: pnpm test:e2e:export
