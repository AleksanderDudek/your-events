name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Backend (IdzNaMiasto scrape pipeline) fires repository_dispatch
  # 'events-updated' right after its morning push to Supabase, so the static
  # site rebuilds within minutes of fresh data instead of waiting for the
  # next scheduled cron below.
  repository_dispatch:
    types: [events-updated]
  # The site is a static export: event detail pages exist only for ids present
  # in the DB at build time (generateStaticParams + dynamicParams=false). New
  # events added to Supabase between code pushes would 404 until the next build,
  # so rebuild on a schedule to keep the static pages fresh as a fallback.
  # Cron is UTC.
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Per-miasto (multi-city). NEXT_PUBLIC_* są wpiekane przy buildzie, więc
          # każde nowe miasto musi tu dostać swój URL + anon key, inaczej zostaje
          # available:false i jest ukryte w pickerze.
          NEXT_PUBLIC_SUPABASE_URL_WROCLAW: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_WROCLAW }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY_WROCLAW: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_WROCLAW }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  # ── Notyfikacja Discord (ten sam kanal co backend pipeline) ──────────────
  # Wysyla po KAZDYM deployu (sukces + fail), zeby caly pipeline (dane backendu
  # + przebudowa frontu) byl widoczny w jednym kanale. Wymaga sekretu
  # DISCORD_WEBHOOK_URL w tym repo (ta sama wartosc co w repo backendu).
  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Brak DISCORD_WEBHOOK_URL – pomijam notyfikacje."
            exit 0
          fi
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            TITLE="🌐 Frontend deploy — ✅ sukces"
            COLOR=4906588          # 0x4ade80 green
          else
            TITLE="🌐 Frontend deploy — ❌ fail (build=$BUILD_RESULT, deploy=$DEPLOY_RESULT)"
            COLOR=15680580         # 0xef4444 red
          fi
          PAGE="${PAGE_URL:-https://aleksanderdudek.github.io/your-events}"
          # jq buduje JSON bezpiecznie (escaping). User-Agent omija Cloudflare 1010.
          payload=$(jq -n \
            --arg title "$TITLE" \
            --arg url "$RUN_URL" \
            --argjson color "$COLOR" \
            --arg event "$EVENT" \
            --arg page "$PAGE" \
            '{
              username: "your-events Deploy",
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                fields: [
                  { name: "Trigger", value: $event, inline: true },
                  { name: "Strona", value: $page, inline: false }
                ]
              }]
            }')
          code=$(curl -sS -o /tmp/discord_resp -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "User-Agent: your-events-deploy/1.0 (+https://github.com/AleksanderDudek/your-events)" \
            -d "$payload" "$DISCORD_WEBHOOK_URL")
          echo "Discord webhook → HTTP $code"
          if [ "$code" != "204" ]; then
            echo "Odpowiedz:"; cat /tmp/discord_resp || true
          fi
